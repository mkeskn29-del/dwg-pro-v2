name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: find . -maxdepth 3 -name "*.zip" -exec unzip -o {} \;
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd975f751698a77b662f1254ddbeed3901e976f5a\n" > "$SDK_DIR/licenses/android-sdk-license"
          GRADLE_FILE=$(find . -maxdepth 4 -name "settings.gradle" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then echo "ZIP icinde android klasoru bulunamadi:"; ls -la; exit 1; fi
          APP_DIR=$(dirname "$GRADLE_FILE")
          echo "sdk.dir=$SDK_DIR" > "$APP_DIR/local.properties"
          cd "$APP_DIR" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DWG-FastView-Pro-APK
          path: "**/app-debug.apk"
